<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="monetag" content="607807bead5bb5da60ee71e51e4857a2" />
    <meta name="google-site-verification" content="9FiC4pBAPrCsYgYG4QJoFg_ydd9tfv2QtqDv8UEy4n8" />
    <meta name="description" content="Sign up and use the referral code to claim a free $10 offer." />
    <title>Welcome Offer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * { box-sizing: border-box; }

      html, body, #root {
        margin: 0;
        width: 100%;
        min-width: 100%;
        min-height: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        background: #f8fafc;
      }

      button { font: inherit; }

      .glass-page {
        position: relative;
        isolation: isolate;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100%;
        padding: 1.25rem;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 12%, rgba(186, 230, 253, 0.7), transparent 26rem),
          radial-gradient(circle at 86% 88%, rgba(221, 214, 254, 0.68), transparent 28rem),
          linear-gradient(135deg, #ffffff 0%, #f8fafc 48%, #eef2ff 100%);
      }

      .glass-page::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.3;
        background-image: linear-gradient(rgba(255,255,255,0.44) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.44) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      .ambient-orb {
        position: absolute;
        border: 1px solid rgba(255,255,255,0.75);
        border-radius: 999px;
        filter: blur(0.2px);
        pointer-events: none;
      }

      .ambient-orb-one {
        width: 19rem;
        height: 19rem;
        top: -8rem;
        right: 12%;
        background: rgba(255,255,255,0.18);
        box-shadow: 0 0 90px rgba(125, 211, 252, 0.32);
      }

      .ambient-orb-two {
        width: 13rem;
        height: 13rem;
        bottom: -5rem;
        left: 12%;
        background: rgba(255,255,255,0.16);
        box-shadow: 0 0 75px rgba(196, 181, 253, 0.35);
      }

      .glass-card {
        position: relative;
        width: min(100%, 27rem);
        padding: clamp(1.6rem, 5vw, 2.45rem);
        border: 1px solid rgba(255,255,255,0.78);
        border-radius: 2rem;
        text-align: center;
        background: linear-gradient(145deg, rgba(255,255,255,0.74), rgba(255,255,255,0.38));
        box-shadow:
          0 30px 80px rgba(71, 85, 105, 0.16),
          inset 0 1px 0 rgba(255,255,255,0.95),
          inset 0 -1px 0 rgba(148,163,184,0.12);
        backdrop-filter: blur(28px) saturate(150%);
        -webkit-backdrop-filter: blur(28px) saturate(150%);
      }

      .glass-card::before {
        content: "";
        position: absolute;
        inset: 0.5rem;
        border: 1px solid rgba(255,255,255,0.42);
        border-radius: 1.55rem;
        pointer-events: none;
      }

      .card-badge, .glass-card h1, .card-copy, .code-panel, .signup-button, .fine-print {
        position: relative;
        z-index: 1;
      }

      .card-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.42rem 0.75rem;
        border: 1px solid rgba(255,255,255,0.86);
        border-radius: 999px;
        color: #475569;
        background: rgba(255,255,255,0.46);
        box-shadow: 0 5px 16px rgba(100,116,139,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge-dot {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: #6366f1;
        box-shadow: 0 0 0 0.2rem rgba(99,102,241,0.12);
      }

      .glass-card h1 {
        margin: 1.2rem 0 0.65rem;
        color: #0f172a;
        font-size: clamp(2.3rem, 10vw, 3.4rem);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .card-copy {
        max-width: 20rem;
        margin: 0 auto;
        color: #64748b;
        font-size: 0.96rem;
        line-height: 1.6;
      }

      .code-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin: 1.45rem 0 1rem;
        padding: 0.9rem 1rem;
        border: 1px solid rgba(255,255,255,0.86);
        border-radius: 1rem;
        text-align: left;
        background: rgba(255,255,255,0.48);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 20px rgba(100,116,139,0.07);
      }

      .code-label {
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .code-panel strong {
        color: #312e81;
        font-size: 1rem;
        letter-spacing: 0.08em;
      }

      .signup-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        width: 100%;
        min-height: 3.45rem;
        border: 1px solid rgba(255,255,255,0.78);
        border-radius: 1.05rem;
        color: #ffffff;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        box-shadow: 0 14px 28px rgba(79,70,229,0.28), inset 0 1px 0 rgba(255,255,255,0.3);
        font-size: 0.98rem;
        font-weight: 750;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }

      .signup-button:hover {
        transform: translateY(-2px);
        filter: saturate(1.08);
        box-shadow: 0 18px 34px rgba(79,70,229,0.36), inset 0 1px 0 rgba(255,255,255,0.34);
      }

      .signup-button:active { transform: translateY(0); }
      .signup-button:focus-visible { outline: 3px solid rgba(99,102,241,0.3); outline-offset: 4px; }
      .arrow-icon { width: 1.15rem; height: 1.15rem; }

      .fine-print {
        margin: 1rem 0 0;
        color: #94a3b8;
        font-size: 0.68rem;
        line-height: 1.45;
      }

      @media (max-width: 380px) {
        .glass-page { padding: 0.8rem; }
        .glass-card { padding: 1.35rem; border-radius: 1.5rem; }
        .glass-card h1 { font-size: 2.45rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
