<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="monetag" content="607807bead5bb5da60ee71e51e4857a2" />
    <meta name="google-site-verification" content="9FiC4pBAPrCsYgYG4QJoFg_ydd9tfv2QtqDv8UEy4n8" />
    <meta name="description" content="Download" />
    <title>Download</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        margin: 0;
        min-width: 100%;
        min-height: 100%;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }

      body {
        overflow: hidden;
      }

      button {
        font: inherit;
      }

      .download-page {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(238, 242, 255, 0.72), transparent 34rem),
          #ffffff;
      }

      .download-page::before {
        content: "";
        position: absolute;
        width: 28rem;
        height: 28rem;
        border: 1px solid rgba(15, 23, 42, 0.045);
        border-radius: 999px;
        pointer-events: none;
      }

      .download-page::after {
        content: "";
        position: absolute;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgba(15, 23, 42, 0.035);
        border-radius: 999px;
        pointer-events: none;
      }

      .download-button {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        min-width: 10.5rem;
        padding: 1rem 1.45rem;
        border: 1px solid rgba(255, 255, 255, 0.86);
        border-radius: 1rem;
        color: #111827;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(241, 245, 249, 0.62));
        box-shadow:
          0 18px 40px rgba(15, 23, 42, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 0 rgba(148, 163, 184, 0.18);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .download-button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(226, 232, 240, 0.76));
        box-shadow:
          0 24px 48px rgba(15, 23, 42, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.98),
          inset 0 -1px 0 rgba(148, 163, 184, 0.2);
      }

      .download-button:active {
        transform: translateY(0);
      }

      .download-button:focus-visible {
        outline: 3px solid rgba(99, 102, 241, 0.28);
        outline-offset: 4px;
      }

      .download-icon {
        width: 1.1rem;
        height: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
